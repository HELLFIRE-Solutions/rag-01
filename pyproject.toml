[project]
name = "rag-01"
version = "0.1.0"
description = "HELLFIRE RAG infrastructure module — ingest, chunk, embed, retrieve, generate"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastembed>=0.4",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
llm = ["anthropic>=0.40"]
mistral = ["mistralai>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]
